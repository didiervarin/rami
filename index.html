<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Rami">
<title>Rami — Flo & Pouille</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #F7F6F2; --surface: #FFFFFF; --surface2: #F0EEE8;
    --border: rgba(0,0,0,0.10); --border2: rgba(0,0,0,0.18);
    --text: #1A1A18; --text2: #6B6A65; --text3: #A8A7A2;
    --green: #3B6D11; --green-bg: #EAF3DE; --green-border: rgba(59,109,17,0.3);
    --red: #A32D2D; --red-bg: #FCEBEB; --red-border: rgba(163,45,45,0.3);
    --flo-bg: #B5D4F4; --flo-text: #0C447C;
    --pouille-bg: #C0DD97; --pouille-text: #27500A;
    --accent: #1A1A18; --radius: 14px; --radius-sm: 8px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111110; --surface: #1E1E1C; --surface2: #2A2A27;
      --border: rgba(255,255,255,0.09); --border2: rgba(255,255,255,0.16);
      --text: #F0EEE8; --text2: #9B9A95; --text3: #5F5E5A;
      --green: #97C459; --green-bg: rgba(59,109,17,0.18); --green-border: rgba(151,196,89,0.3);
      --red: #F09595; --red-bg: rgba(163,45,45,0.18); --red-border: rgba(240,149,149,0.3);
      --flo-bg: #0C447C; --flo-text: #B5D4F4;
      --pouille-bg: #27500A; --pouille-text: #C0DD97;
      --accent: #F0EEE8;
    }
  }
  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif; -webkit-font-smoothing: antialiased; }
  body { min-height: 100svh; padding-bottom: calc(env(safe-area-inset-bottom) + 16px); }
  .app { max-width: 440px; margin: 0 auto; padding: 16px 16px 40px; }

  /* Status */
  .status-bar { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; padding: 8px 12px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); flex-shrink: 0; }
  .status-text { color: var(--text2); flex: 1; font-size: 12px; }
  .status-btn { color: var(--text3); font-size: 12px; cursor: pointer; padding: 2px 8px; border: 1px solid var(--border); border-radius: 20px; background: none; font-family: inherit; }

  /* Config panel */
  .config-panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 14px; display: flex; flex-direction: column; gap: 10px; }
  .config-panel h2 { font-size: 15px; font-weight: 600; color: var(--text); }
  .btn-danger { border: 1px solid var(--red-border); border-radius: var(--radius-sm); padding: 11px; font-size: 14px; background: none; color: var(--red); cursor: pointer; font-family: inherit; width: 100%; }
  .btn-export { border: 1px solid var(--border2); border-radius: var(--radius-sm); padding: 11px; font-size: 14px; background: none; color: var(--text2); cursor: pointer; font-family: inherit; width: 100%; }

  /* Header */
  .header { text-align: center; padding: 4px 0 14px; }
  .header h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.5px; }
  .header .sub { font-size: 14px; color: var(--text2); margin-top: 2px; }

  /* Partie badge */
  .partie-row { text-align: center; margin-bottom: 10px; }
  .partie-badge { display: inline-block; background: var(--surface); border: 1px solid var(--border2); border-radius: 20px; padding: 6px 20px; font-size: 13px; color: var(--text2); }
  .partie-badge .code { font-size: 22px; font-weight: 700; color: var(--text); margin: 0 2px; letter-spacing: 1px; font-variant-numeric: tabular-nums; }

  /* Dots */
  .dots { display: flex; gap: 6px; justify-content: center; margin-bottom: 12px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--border2); }
  .dot.done { background: var(--text); }
  .dot.current { background: var(--text2); outline: 2px solid var(--text); outline-offset: 1px; }

  /* Dealer */
  .dealer-bar { text-align: center; font-size: 14px; font-weight: 600; color: var(--text2); background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 8px 14px; margin-bottom: 10px; }

  /* Banner */
  .banner { border-radius: var(--radius); padding: 12px 16px; text-align: center; font-size: 15px; font-weight: 600; margin-bottom: 14px; min-height: 46px; display: flex; align-items: center; justify-content: center; border: 1px solid var(--border); background: var(--surface); color: var(--text2); transition: background 0.3s, color 0.3s; }
  .banner.winning { background: var(--green-bg); border-color: var(--green-border); color: var(--green); }

  /* Players */
  .players { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
  .player-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 12px; text-align: center; transition: border-color 0.25s, background 0.25s; }
  .player-card.losing { background: var(--red-bg); border-color: var(--red-border); }
  .player-card.winning { background: var(--green-bg); border-color: var(--green-border); }
  .avatar { width: 64px; height: 64px; border-radius: 50%; margin: 0 auto 10px; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 700; overflow: hidden; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .avatar.flo { background: var(--flo-bg); color: var(--flo-text); }
  .avatar.pouille { background: var(--pouille-bg); color: var(--pouille-text); }
  .player-name { font-size: 17px; font-weight: 600; color: var(--text); }
  .rami-sec { font-size: 12px; color: var(--text3); margin-bottom: 2px; font-weight: 500; }
  .rami-sec.has-rami { color: var(--green); font-weight: 700; }
  .player-total { font-size: 32px; font-weight: 700; letter-spacing: -1px; color: var(--text); margin: 6px 0; transition: color 0.25s; }
  .player-total.winning { color: var(--green); }
  .player-total.losing { color: var(--red); }
  .score-label { font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
  .score-input { width: 100%; border: 1px solid var(--border2); border-radius: var(--radius-sm); padding: 10px 8px; font-size: 22px; font-weight: 600; text-align: center; background: var(--bg); color: var(--text); -webkit-appearance: none; font-family: inherit; }
  .score-input:focus { outline: none; border-color: var(--accent); }

  /* Actions */
  .btn { border: 1px solid var(--border2); border-radius: var(--radius-sm); padding: 13px 10px; font-size: 15px; font-weight: 500; background: var(--surface); color: var(--text); cursor: pointer; font-family: inherit; -webkit-tap-highlight-color: transparent; transition: opacity 0.15s, transform 0.1s; touch-action: manipulation; }
  .btn:active { transform: scale(0.97); opacity: 0.8; }
  .btn.primary { background: var(--accent); color: var(--bg); border-color: transparent; }

  .hidden { display: none !important; }
</style>
</head>
<body>

<div class="app" id="mainApp">
  <div class="status-bar">
    <div class="status-dot" id="statusDot"></div>
    <span class="status-text" id="statusText">Scores sauvegardés localement</span>
    <button class="status-btn" onclick="toggleConfig()">⚙ Config</button>
  </div>

  <div class="config-panel hidden" id="configPanel">
    <h2>Configuration</h2>
    <button class="btn-export" onclick="exportTxt()">📄 Exporter .txt</button>
    <button class="btn-danger" onclick="resetAll()">🗑 Tout réinitialiser</button>
  </div>

  <div class="header">
    <h1>Rami 🃏</h1>
    <p class="sub">Flo & Pouille</p>

      <div class="player-name">Pouille</div>
      <div class="rami-sec" id="ramiSecPouille">0 rami sec</div>
      <div class="player-total" id="totalPouille">0</div>
      <div class="score-label">Total</div>
      <input class="score-input" type="number" id="scorePouille" inputmode="decimal" placeholder="—" oninput="autoFill('pouille')">

  <div style="display:grid;gap:10px;margin-bottom:18px;">
    <button class="btn primary" onclick="validerPartie()">Valider ✓</button>
  </div>

</div>

<script>
// ── État ──────────────────────────────────────────────────────
let state = {
  mancheNum: 1, partieNum: 5,
  totalFlo: 0, totalPouille: 0,
  partiesJouees: 0,
  ramiSecFlo: 0, ramiSecPouille: 0,
};

const LS_KEY = 'rami_state_v3';

// ── Persistance localStorage ──────────────────────────────────
function sauvegarder() {
  try {
    localStorage.setItem(LS_KEY, JSON.stringify(state));
    setStatus('Sauvegardé ✓');
  } catch(e) {
    setStatus('Erreur localStorage');
  }
}

function charger() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) {
      const saved = JSON.parse(raw);
      // Fusion sécurisée (compatibilité anciens états)
      state = { ...state, ...saved };
      state.ramiSecFlo = state.ramiSecFlo || 0;
      state.ramiSecPouille = state.ramiSecPouille || 0;
    }
  } catch(e) {}
}

// ── Helpers ───────────────────────────────────────────────────
function pad(n, l) { return String(n).padStart(l, '0'); }
function partieCode() { return pad(state.mancheNum, 3) + '-' + state.partieNum; }
function manchesJouees() { return Math.floor(state.partiesJouees / 5); }

function getDealer(mancheN, partieN) {
  const firstIsPouille = (mancheN % 2 === 1);
  const idx = 5 - partieN;
  return (idx % 2 === 0) ? (firstIsPouille ? 'pouille' : 'flo') : (firstIsPouille ? 'flo' : 'pouille');
}

function setStatus(text) {
  document.getElementById('statusText').textContent = text;
}

function toggleConfig() {
  const p = document.getElementById('configPanel');
  p.classList.toggle('hidden');
}

// ── Rendu ─────────────────────────────────────────────────────
function render() {
  document.getElementById('partieCode').textContent = partieCode();

  const dotsEl = document.getElementById('dots');
  dotsEl.innerHTML = '';
  for (let i = 5; i >= 1; i--) {
    const d = document.createElement('div');
    if (i > state.partieNum) d.className = 'dot done';
    else if (i === state.partieNum) d.className = 'dot current';
    else d.className = 'dot';
    dotsEl.appendChild(d);
  }

  document.getElementById('scoreFlo').value = '';
  document.getElementById('scorePouille').value = '';

  document.getElementById('totalFlo').textContent = state.totalFlo;
  document.getElementById('totalPouille').textContent = state.totalPouille;
  applyWinState(state.totalFlo, state.totalPouille);

  const rsF = state.ramiSecFlo || 0;
  const rsP = state.ramiSecPouille || 0;
  const elRsF = document.getElementById('ramiSecFlo');
  const elRsP = document.getElementById('ramiSecPouille');
  elRsF.textContent = rsF + (rsF > 1 ? ' ramis secs' : ' rami sec');
  elRsF.className = 'rami-sec' + (rsF > 0 ? ' has-rami' : '');
  elRsP.textContent = rsP + (rsP > 1 ? ' ramis secs' : ' rami sec');
  elRsP.className = 'rami-sec' + (rsP > 0 ? ' has-rami' : '');

  const dealer = getDealer(state.mancheNum, state.partieNum);
  document.getElementById('dealerBar').textContent = '🃏 À ' + (dealer === 'flo' ? 'Flo' : 'Pouille') + ' de distribuer';
}

function applyWinState(f, p) {
  const banner = document.getElementById('banner');
  const cardF = document.getElementById('cardFlo'), cardP = document.getElementById('cardPouille');
  const totF = document.getElementById('totalFlo'), totP = document.getElementById('totalPouille');
  cardF.className = 'player-card'; cardP.className = 'player-card';
  totF.className = 'player-total'; totP.className = 'player-total';
  banner.className = 'banner';
  if (f === 0 && p === 0) {
    banner.textContent = 'En attente des scores…';
  } else if (f === p) {
    banner.textContent = 'Égalité au total !';
  } else if (f > p) {
    banner.textContent = '👑 Pouille gagne — ' + (f - p) + " pts d'avance";
    banner.className = 'banner winning';
    cardP.className = 'player-card winning'; totP.className = 'player-total winning';
    cardF.className = 'player-card losing'; totF.className = 'player-total losing';
  } else {
    banner.textContent = '👑 Flo gagne — ' + (p - f) + " pts d'avance";
    banner.className = 'banner winning';
    cardF.className = 'player-card winning'; totF.className = 'player-total winning';
    cardP.className = 'player-card losing'; totP.className = 'player-total losing';
  }
}

function autoFill(who) {
  const inputFlo = document.getElementById('scoreFlo');
  const inputPouille = document.getElementById('scorePouille');
  if (who === 'flo') {
    const v = inputFlo.value.trim();
    if (v !== '' && v !== '-') inputPouille.value = 0;
    else if (v === '') inputPouille.value = '';
  } else {
    const v = inputPouille.value.trim();
    if (v !== '' && v !== '-') inputFlo.value = 0;
    else if (v === '') inputFlo.value = '';
  }
  updatePreview();
}

function updatePreview() {
  const fv = parseInt(document.getElementById('scoreFlo').value);
  const pv = parseInt(document.getElementById('scorePouille').value);
  const previewF = state.totalFlo + (isNaN(fv) ? 0 : fv);
  const previewP = state.totalPouille + (isNaN(pv) ? 0 : pv);
  document.getElementById('totalFlo').textContent = previewF;
  document.getElementById('totalPouille').textContent = previewP;
  applyWinState(previewF, previewP);
}

// ── Actions ───────────────────────────────────────────────────
function validerPartie() {
  let f = parseInt(document.getElementById('scoreFlo').value);
  let p = parseInt(document.getElementById('scorePouille').value);
  if (isNaN(f) && isNaN(p)) { alert('Entrez au moins un score.'); return; }
  if (isNaN(f)) f = 0;
  if (isNaN(p)) p = 0;

  // Rami sec : celui qui a 200 pts en a infligé un à l'autre
  if (!state.ramiSecFlo) state.ramiSecFlo = 0;
  if (!state.ramiSecPouille) state.ramiSecPouille = 0;
  if (p === 200) state.ramiSecFlo++;     // Pouille a 200 → Flo a fait rami sec
  if (f === 200) state.ramiSecPouille++; // Flo a 200 → Pouille a fait rami sec

  state.totalFlo += f;
  state.totalPouille += p;
  state.partiesJouees++;

  if (state.partieNum > 1) {
    state.partieNum--;
  } else {
    state.mancheNum++;
    state.partieNum = 5;
  }

  sauvegarder();
  render();
}

function resetAll() {
  if (!confirm('Remettre tous les scores à zéro ?')) return;
  state = { mancheNum: 1, partieNum: 5, totalFlo: 0, totalPouille: 0, partiesJouees: 0, ramiSecFlo: 0, ramiSecPouille: 0 };
  sauvegarder();
  render();
  document.getElementById('configPanel').classList.add('hidden');
}

// ── Export TXT ────────────────────────────────────────────────
function exportTxt() {
  const d = new Date().toLocaleString('fr-FR');
  const diff = Math.abs(state.totalFlo - state.totalPouille);
  const winner = state.totalFlo < state.totalPouille ? 'Flo' : state.totalPouille < state.totalFlo ? 'Pouille' : null;
  let txt = '=== RAMI — Flo & Pouille ===\n';
  txt += 'Exporté le : ' + d + '\n';
  txt += '================================\n\n';
  txt += 'Parties jouées  : ' + state.partiesJouees + '\n';
  txt += 'Manches jouées  : ' + manchesJouees() + '\n';
  txt += 'Partie en cours : ' + partieCode() + '\n\n';
  txt += 'Total Flo       : ' + state.totalFlo + '\n';
  txt += 'Total Pouille   : ' + state.totalPouille + '\n';
  txt += 'Rami sec Flo    : ' + (state.ramiSecFlo || 0) + '\n';
  txt += 'Rami sec Pouille: ' + (state.ramiSecPouille || 0) + '\n\n';
  if (winner) txt += 'Avance : ' + winner + ' gagne de ' + diff + ' pts\n';
  else txt += 'Résultat : Égalité !\n';

  const blob = new Blob([txt], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'rami-scores.txt'; a.click();
  URL.revokeObjectURL(url);
}

// ── Init ──────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  charger();
  render();
  setStatus('Scores sauvegardés localement');
});
</script>
